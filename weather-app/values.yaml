namespace: weather-app

image:
  repository: sveshnikov/app
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 2

serviceName: weather-app

updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1
    maxSurge: 0

containerPort: 8000
servicePort: 80

apiKeySecret:
  name: weather-app-secret
  key: API_KEY

resources:
  requests:
    memory: 256Mi
    cpu: 200m
  limits:
    memory: 512Mi
    cpu: 400m

livenessProbe:
  path: /info
  port: 8000
  initialDelaySeconds: 30
  periodSeconds: 20

readinessProbe:
  path: /info
  port: 8000
  initialDelaySeconds: 10
  periodSeconds: 10

podAntiAffinity:
  enabled: true
  labelKey: app
  labelValue: weather-app
  topologyKey: kubernetes.io/hostname

nodeSelector:
  node-role.kubernetes.io/worker: ""

service:
  type: NodePort
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: nginx
  host: weather-app.local
  tls:
    enabled: true
    secretName: weather-app-tls
  pathType: ImplementationSpecific

pdb:
  enabled: true
  minAvailable: 1

resourceQuota:
  enabled: true
  hard:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
    pods: "4"
